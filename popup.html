<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      min-height: 200px;
      max-height: 550px;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow-y: auto;
    }

    .header {
      background: linear-gradient(135deg, #e53935, #ff6f00);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 { font-size: 15px; font-weight: 700; color: #fff; }

    .header .btn-group { display: flex; gap: 6px; }

    .header button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .header button:hover { background: rgba(255,255,255,0.35); }

    .server-status {
      padding: 10px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #16213e;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online { background: #4caf50; }
    .status-dot.offline { background: #f44336; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
    .empty p { font-size: 13px; line-height: 1.6; }

    .video-list { padding: 8px; }

    .video-item {
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .video-item:hover { background: #1a2745; }

    .video-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .video-icon {
      width: 40px; height: 40px; border-radius: 8px;
      background: rgba(229, 57, 53, 0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .video-icon svg { width: 20px; height: 20px; fill: #e53935; }

    .video-info { flex: 1; min-width: 0; }

    .video-name {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      direction: ltr; text-align: left;
    }

    .video-meta {
      font-size: 11px; color: #888; margin-top: 3px;
      display: flex; gap: 8px; direction: ltr; flex-wrap: wrap;
    }

    .badge {
      background: rgba(229, 57, 53, 0.15);
      color: #e53935;
      padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 600;
    }

    .badge.quality {
      background: rgba(76, 175, 80, 0.15);
      color: #66bb6a;
    }

    .badge.audio {
      background: rgba(33, 150, 243, 0.15);
      color: #42a5f5;
    }

    .download-btn, .fetch-btn {
      border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    .download-btn { background: #e53935; }
    .download-btn:hover { background: #f44336; transform: scale(1.05); }

    .fetch-btn { background: #1976d2; }
    .fetch-btn:hover { background: #2196f3; transform: scale(1.05); }

    .download-btn:active, .fetch-btn:active { transform: scale(0.95); }
    .download-btn svg, .fetch-btn svg { width: 18px; height: 18px; fill: #fff; }

    .formats-section {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
    }

    .format-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.03);
      transition: background 0.2s;
    }

    .format-row:hover { background: rgba(255,255,255,0.08); }

    .format-info {
      display: flex; gap: 8px; align-items: center;
      font-size: 12px; direction: ltr;
    }

    .format-dl-btn {
      background: #43a047;
      border: none; color: #fff;
      padding: 4px 10px; border-radius: 5px;
      cursor: pointer; font-size: 11px; font-family: inherit;
      transition: background 0.2s;
    }

    .format-dl-btn:hover { background: #4caf50; }
    .format-dl-btn:disabled { background: #555; cursor: not-allowed; }

    .progress-bar {
      width: 100%; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.1);
      margin-top: 8px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #e53935, #ff6f00);
      transition: width 0.3s;
    }

    .loading {
      text-align: center; padding: 30px; color: #888; font-size: 13px;
    }

    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #e53935;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Video Downloader</h1>
    <div class="btn-group">
      <button id="historyBtn">History</button>
      <button id="scanBtn">Scan</button>
    </div>
  </div>

  <div class="server-status" id="serverStatus">
    <div class="status-dot offline" id="statusDot"></div>
    <span id="statusText">Checking server...</span>
  </div>

  <div id="content">
    <div class="loading">Loading...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
